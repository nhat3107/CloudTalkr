version: 0.2
env:
  variables:
    INSTANCE_TAG: "backend-server" # Tag Name của EC2 backend
phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "No dependencies for build server"
  build:
    commands:
      - echo "Skipping build (handled on EC2)"
  post_build:
    commands:
      - echo "Get EC2 Instance ID from tag..."
      - |
        INSTANCE_ID=$(aws ec2 describe-instances \
          --filters "Name=tag:Name,Values=$INSTANCE_TAG" \
          --query "Reservations[].Instances[].InstanceId" \
          --output text)
        echo "Deploying to $INSTANCE_ID..."
        aws ssm send-command \
          --targets "Key=instanceIds,Values=$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy backend" \
          --parameters 'commands=[
            "cd /var/www/backend && git pull origin main",
            "npm ci --production",
            "pm2 restart all"
          ]'
