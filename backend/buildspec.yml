version: 0.2
env:
  variables:
    INSTANCE_TAG: "backend-server"
phases:
  install:
    runtime-versions:
      nodejs: 18
  build:
    commands:
      - echo "No build for backend here"
  post_build:
    commands:
      - echo "Getting EC2 instance ID from tag..."
      - |
        INSTANCE_ID=$(aws ec2 describe-instances \
          --filters "Name=tag:Name,Values=$INSTANCE_TAG" \
          --query "Reservations[].Instances[].InstanceId" \
          --output text)
        echo "Deploying to $INSTANCE_ID..."
        aws ssm send-command \
          --targets "Key=instanceIds,Values=$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy backend" \
          --parameters 'commands=[
            "cd ~/CloudTalkr && git reset --hard && git pull origin main",
            "npm ci --production",
            "pm2 restart all"
          ]'
