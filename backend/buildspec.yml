version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies for backend..."
      - cd backend
      - npm install
  build:
    commands:
      - echo "Fetching environment variables from SSM..."
      - for name in PORT DATABASE_URL STREAM_API_KEY STREAM_API_SECRET JWT_SECRET_KEY NODE_ENV CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET; do
          aws ssm get-parameter --name "$name" --with-decryption --query "Parameter.Value" --output text >> .env;
        done
      - echo "Build step complete. Ready for deployment."
  post_build:
    commands:
      - echo "Zipping backend folder for CodeDeploy..."
      - cd ..
      - zip -r backend.zip backend appspec.yml
artifacts:
  files:
    - backend.zip
