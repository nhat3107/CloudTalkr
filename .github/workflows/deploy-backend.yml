name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
      - staging
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Deployment

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/cloudtalkr:${{ github.ref_name }} ./backend

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/cloudtalkr:${{ github.ref_name }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/cloudtalkr:${{ github.ref_name }}

            # Export environment variables (from GitHub Secrets)
            export PORT=${{ secrets.PORT }}
            export NODE_ENV=${{ github.ref_name }}
            export DATABASE_URL=${{ secrets.DATABASE_URL }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            export CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            export CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            export CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            export STREAM_API_KEY=${{ secrets.STREAM_API_KEY }}
            export STREAM_API_SECRET=${{ secrets.STREAM_API_SECRET }}
            export FRONTEND_URL=${{ secrets.FRONTEND_URL }}

            # Restart docker compose
            docker compose down
            docker compose up -d
