version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Installing frontend dependencies..."
        - cd frontend
        - npm ci
    build:
      commands:
        - echo "Building frontend..."
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - "**/*"
  cache:
    paths:
      - frontend/node_modules/**/*
      - frontend/.npm-cache/**/*

backend:
  phases:
    preBuild:
      commands:
        - echo "Installing backend dependencies..."
        - cd backend
        - npm ci
    build:
      commands:
        - echo "Building backend..."
        - npm run build
  artifacts:
    baseDirectory: backend
    files:
      - "**/*"
      - "!node_modules/**/*"
      - "!src/**/*"
      - "!package-lock.json"
  cache:
    paths:
      - backend/node_modules/**/*
      - backend/.npm-cache/**/*
